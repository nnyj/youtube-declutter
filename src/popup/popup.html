<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>YouTube Declutter</title>
  <link rel="stylesheet" href="popup.css">
  <script src="strings.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img class="brand_icon" src="../icons/icon.svg" alt="" width="22" height="22">
      <h1 class="brand_name" data-i18n="app_name"></h1>
    </div>
    <button id="power" class="power" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M12 3v8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M6.6 6.8a8 8 0 1 0 10.8 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main class="body">
    <div id="groups" class="groups"></div>
    <p id="off_message" class="off_message" data-i18n="off_message" hidden></p>
  </main>

  <footer class="footer">
    <span id="version" class="version"></span>
    <a id="feedback" class="feedback" href="https://github.com/nnyj/youtube-declutter/issues" target="_blank" rel="noopener" data-i18n="feedback"></a>
  </footer>
</body>
</html>
